name: prepare release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-preparation
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = "refs/heads/main"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
          cache: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate the next release version
        run: |
          node scripts/version.mjs prepare-check
          sh -n deploy/update.sh
      - name: Audit dependencies and source secrets
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 detect --no-git --source . --redact --exit-code 1 --no-banner
          npm --prefix web audit --audit-level=high
      - name: Test and build frontend
        working-directory: web
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build
      - name: Test and vet backend
        run: |
          go test -race ./...
          go vet ./...
      - name: Create the annotated tag and dispatch the signed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(cat VERSION)"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Reusing $TAG after an interrupted release run."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Outlook Mail Manager $TAG"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing a duplicate." >&2
            exit 1
          fi
          gh workflow run release.yml --ref "$TAG" -f tag="$TAG"
