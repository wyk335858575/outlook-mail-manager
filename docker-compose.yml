services:
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.0.2}
    image: ${APP_IMAGE:-ghcr.io/wyk335858575/outlook-mail-manager:1.0.2}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_LISTEN_ADDR: :8080
      APP_DATA_DIR: /data
      APP_VERSION: ${APP_VERSION:-1.0.2}
      APP_UPDATE_REPOSITORY: ${APP_UPDATE_REPOSITORY:-}
      APP_IMAGE: ${APP_IMAGE:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - outlook_data:/data
    mem_limit: 768m
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  outlook_data:
